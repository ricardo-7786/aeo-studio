# 주 1회 네이버 플레이스 순위 점검 → 텔레그램 요약
# 스케줄: 매주 월요일 09:00 KST (= 00:00 UTC)
#
# GitHub → Settings → Secrets and variables → Actions 에 추가:
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
#
# 수동 실행: Actions → Rank weekly → Run workflow

name: Rank weekly

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "키워드 개수 (0=전체)"
        required: false
        default: "0"

jobs:
  rank-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-dotenv lxml
          pip install playwright pandas openpyxl
          playwright install chromium --with-deps

      - name: Run weekly rank job
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RANK_BROWSER_CHANNEL: chromium
          RANK_SCHEDULE_LIMIT: ${{ github.event.inputs.limit || '0' }}
          RANK_DELAY_MIN: "2"
          RANK_DELAY_MAX: "4"
        run: |
          set -e
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Secrets TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 가 없습니다."
            exit 1
          fi
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ] || [ "$LIMIT" = "0" ]; then
            python scripts/rank_weekly_job.py --channel chromium
          else
            python scripts/rank_weekly_job.py --channel chromium --limit "$LIMIT"
          fi

      - name: Upload excel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank-result
          path: |
            rank_result_*.xlsx
            captures/
          if-no-files-found: ignore
          retention-days: 14
